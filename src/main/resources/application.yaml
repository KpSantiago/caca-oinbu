application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 30

spring:
  application:
    name: caca-oinbu

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: jdbc:${DB_URL}
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    default-schema: public
    create-schemas: true